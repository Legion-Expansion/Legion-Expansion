sonar.python.version=3.10
sonar.projectVersion=1.33.1

# src/pa_tools is a git submodule, an unmodified fork of domdom/pa_tools.
# Vendored third-party build tooling, not maintained here.
sonar.exclusions=src/pa_tools/**/*

# stylelint.config.mjs is long lists of "name", // Chrome NN entries. Copy-paste
# detection drops comments and normalises literals, so the lists match themselves.
sonar.cpd.exclusions=stylelint.config.mjs
